[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelscope-eval"
version = "0.1.0"
description = "A reproducible Python toolkit for evaluating text model outputs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Fabian Williams"}]
keywords = ["evaluation", "machine-learning", "llm", "python"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]

[project.scripts]
modelscope-eval = "modelscope_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
